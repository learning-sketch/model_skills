# ==============================================================================
# 硬件 Profile 模板
# ==============================================================================
# 这份文件是迁移后 skills 的唯一硬件事实来源（single source of truth）。
#
# 迁移后的每个 skill 正文只写厂商中性的方法论，所有与具体芯片相关的 API 名、
# 工具命令、规格数字、错误码，都通过 {{profile.<路径>}} 占位符引用本文件。
# 填完这一份 YAML，整套 skills 就能在你的芯片上工作。
#
# 用法：
#   1. 复制本文件为 hardware-profiles/<你的芯片名>.yaml
#   2. 逐项填写；参考 cuda-reference.yaml（CUDA 生态的填法示例）
#   3. 填不了的项保持 null，并在 unknown_or_unsupported 里登记原因
#   4. 在 README.md 中把 active_profile 指向你的文件
#
# 字段状态约定（每个大节都有 _status 字段）：
#   verified     —— 已在真机上验证过
#   assumed      —— 按类 CUDA 语义推定，尚未验证
#   not_supported—— 本芯片确实没有这个能力
#   unknown      —— 还没查
#
# 填写纪律：宁可留 null + unknown，不要臆造 API 名和规格数字。
# 迁移后的 skills 会检查字段状态：遇到 assumed/unknown 会提示先验证再执行。
# ==============================================================================

schema_version: 1

# ------------------------------------------------------------------------------
# 1. 身份
# ------------------------------------------------------------------------------
vendor:
  # 厂商名，用于文档中的称呼
  name: null                      # 例: "Acme"
  # 芯片产品族
  chip_family: null               # 例: "AcmeAccel X"
  # 一句话描述架构类型，影响多个 skill 的建议方向
  # 推荐取值: "SIMT"（类 CUDA，统一标量核）/ "SIMT+TensorCore" /
  #           "heterogeneous"（计算单元分离，如 cube+vector 分离式）
  architecture_class: null        # 例: "SIMT+TensorCore"

# ------------------------------------------------------------------------------
# 2. PyTorch 集成层
#    —— 几乎所有 skill 都要用。决定代码示例怎么写。
# ------------------------------------------------------------------------------
pytorch:
  _status: unknown

  # torch 里的设备类型字符串，用于 tensor.to(...)、device= 参数
  device_type: null               # 例: "cuda" / "acme"

  # 是否需要 import 一个设备扩展包才能启用设备。CUDA 为 null（原生内置）
  extension_module: null          # 例: null / "torch_acme"

  # 设备 API 命名空间。所有 torch.cuda.* 等价调用从这里取
  device_namespace: null          # 例: "torch.cuda" / "torch.acme"

  # 是否通过 PrivateUse1 后端接入（影响很多 PyTorch 原生特性的可用性）
  uses_privateuse1_backend: null  # true / false

  # 下面这些是 skills 里高频引用的具体调用。写完整可调用名。
  api:
    synchronize: null             # 例: "torch.cuda.synchronize"
    set_device: null              # 例: "torch.cuda.set_device"
    current_device: null
    device_count: null
    empty_cache: null             # 例: "torch.cuda.empty_cache"
    max_memory_allocated: null    # 例: "torch.cuda.max_memory_allocated"
    memory_allocated: null
    reset_peak_memory_stats: null
    # 限制进程可用显存比例。OOM skill 的"内存水线"步骤依赖它
    set_per_process_memory_fraction: null
    # 显存快照。OOM skill 的 Step3 依赖它
    record_memory_history: null   # 例: "torch.cuda.memory._record_memory_history"
    dump_memory_snapshot: null    # 例: "torch.cuda.memory._dump_snapshot"
    # 流与事件。multi-stream skill 依赖它
    stream_class: null            # 例: "torch.cuda.Stream"
    event_class: null             # 例: "torch.cuda.Event"
    stream_context: null          # 例: "torch.cuda.stream"
    record_stream: null           # 例: "Tensor.record_stream"
    # 确定性开关。train-precision skills 依赖它
    deterministic_api: null       # 例: "torch.use_deterministic_algorithms"

  # 显存快照 pickle 是否与 PyTorch 上游 CUDA 格式同构
  # （决定 model-train-oom-analysis 的 analyze_snapshot.py 能否直接用）
  memory_snapshot_format_compatible: null   # true / false / "partial"

# ------------------------------------------------------------------------------
# 3. 设备规格
#    —— parallel-analysis 的显存/带宽估算、oom-analysis 的预算判断依赖这里。
#    多型号就写多条。
# ------------------------------------------------------------------------------
devices:
  _status: unknown
  models:
    - model: null                 # 例: "X100"
      memory_gb: null             # 单卡可用显存（GB），注意是可用不是标称
      memory_bandwidth_gb_s: null # HBM/DRAM 带宽
      # 算力。按实际支持的 dtype 填，不支持的留 null
      compute:
        fp32_tflops: null
        tf32_tflops: null
        fp16_tflops: null
        bf16_tflops: null
        fp8_tflops: null
        int8_tops: null
        int4_tops: null
      # 计算单元。架构不同填法不同：
      #   SIMT 类填 sm_count / tensor_core_count
      #   分离式架构填各类核的数量
      compute_units:
        type: null                # 例: "SM" / "cube+vector"
        count: null               # 例: 132
        # 分离式架构在这里补充各类核数量，SIMT 留空
        detail: {}
      cache:
        l2_mb: null
        shared_mem_per_unit_kb: null

# ------------------------------------------------------------------------------
# 4. 互联与集合通信
#    —— parallel-analysis 的通信代价估算、parallel-impl、runtime-debug 依赖这里。
# ------------------------------------------------------------------------------
interconnect:
  _status: unknown
  # 节点内卡间互联
  intra_node:
    name: null                    # 例: "NVLink" / "AcmeLink"
    bandwidth_gb_s: null          # 单向带宽
    topology: null                # 例: "all-to-all" / "ring" / "switch"
    cards_per_node: null
  # 跨节点
  inter_node:
    name: null                    # 例: "InfiniBand NDR" / "RoCE v2"
    bandwidth_gb_s: null

collective:
  _status: unknown
  # 集合通信库名
  library: null                   # 例: "NCCL" / "AcmeCCL"
  # torch.distributed.init_process_group(backend=...) 用的字符串
  torch_backend: null             # 例: "nccl" / "acmeccl"
  # 支持的原语。不支持的从列表里删掉
  primitives:
    - all_reduce
    - all_gather
    - reduce_scatter
    - all_to_all
    - broadcast
    - send_recv
  # 调优/排障用的环境变量。runtime-debug、parallel-impl 会引用
  env_vars:
    buffer_size: null             # 例: "NCCL_BUFFSIZE"
    connect_timeout: null         # 例: "NCCL_COMM_TIMEOUT"
    exec_timeout: null
    interface_select: null        # 例: "NCCL_SOCKET_IFNAME"
    debug_level: null             # 例: "NCCL_DEBUG"
  # 是否有把集合通信与矩阵计算编进同一个算子的能力。
  # 有这类算子就能省掉中间结果的往返，是 MoE 并行的关键优化点。
  # 影响 model-infer-parallel-impl 的 MoE 并行路径能否迁移
  fused_comm_compute_ops:
    available: null               # true / false
    ops: []                       # 有的话列出算子名

# ------------------------------------------------------------------------------
# 5. Profiler
#    —— perf-breakdown、profiling、multi-stream 的验证环节、recommend-analysis
#       全部依赖这里。这是迁移成本最集中的一节。
# ------------------------------------------------------------------------------
profiler:
  _status: unknown

  # 采集入口
  api: null                       # 例: "torch.profiler.profile"
  # 是否支持 torch.profiler 标准接口（决定采集代码能否直接复用）
  torch_profiler_compatible: null # true / false / "partial"
  # 命令行 profiler
  cli_tool: null                  # 例: "nsys" / "ncu" / "acme-prof"

  # 产物布局。perf-breakdown 的输入发现逻辑依赖它
  output:
    root_dir_pattern: null        # 例: "*.nsys-rep" / "{run}_acme_pt/"
    kernel_table_file: null       # 例: "kernel_details.csv"
    trace_file: null              # 例: "trace.json"
    op_summary_file: null
    comm_file: null

  # kernel 表的列名映射。
  # 左边是 skills 内部使用的统一字段名（不要改），右边填你的 profiler 实际列名。
  # 这张表是 model-infer-perf-breakdown 适配层的核心输入。
  kernel_table_columns:
    step_id: null                 # 统一字段 step_id   ← 你的列名
    name: null                    # kernel 名
    duration_us: null             # 执行时长（微秒）
    start_time_us: null           # 起始时间戳（微秒）
    stream_id: null               # 流 ID
    task_type: null               # kernel 类型分类列
    device_id: null
    wait_time_us: null            # 可选
    block_dim: null               # 可选，并行度
    input_shapes: null            # 可选
    output_shapes: null           # 可选

  # task_type 列的取值词表。skills 用它区分计算/通信/主机侧 kernel。
  task_type_values:
    compute: []                   # 例: ["kernel", "gemm"]
    communication: []             # 例: ["nccl"]
    memory: []                    # 例: ["memcpy", "memset"]
    host_fallback: []             # 对应昇腾 AI_CPU 那类"掉回主机算"的标记

  # 硬件计数器 / 流水线利用率指标。
  # 昇腾有 aic_mac_ratio / cube_utilization 那一套；填你的等价物。
  # 没有就留空列表，相关的 roofline 判据会退化为只看时间。
  hardware_counters:
    available: null               # true / false
    compute_utilization: null     # 例: "sm__throughput.avg.pct_of_peak_sustained_elapsed"
    memory_utilization: null      # 例: "dram__throughput.avg.pct_of_peak_sustained_elapsed"
    tensor_core_utilization: null
    # 判定算子是 memory-bound 还是 compute-bound 的阈值
    # prefetch / perf-breakdown / recommend-analysis 用
    memory_bound_threshold: null  # 例: 0.6（访存利用率超过它判为 memory-bound）
    low_utilization_threshold: null

# ------------------------------------------------------------------------------
# 6. 图模式 / 编译
#    —— graph-mode、multi-stream 的实现路径、superkernel 类优化依赖这里。
# ------------------------------------------------------------------------------
graph:
  _status: unknown

  # 支持的执行模式。不支持的删掉
  modes: []                       # 例: ["eager", "torch_compile", "graph_capture"]

  # torch.compile 后端名
  torch_compile_backend: null     # 例: "inductor" / "acme"
  torch_compile_supported: null   # true / false / "partial"

  # 图捕获重放（CUDA Graph 那一类）
  graph_capture:
    available: null               # true / false
    api: null                     # 例: "torch.cuda.CUDAGraph"
    torch_compile_mode: null      # 例: "reduce-overhead"
    # 捕获期的限制。graph-mode skill 的静态化检查清单依赖它
    constraints:
      static_shape_required: null       # true / false
      static_address_required: null     # 输入输出地址是否必须固定
      host_sync_forbidden: null         # 捕获期是否禁止 .item() 等主机同步
      dynamic_control_flow_forbidden: null
      collective_ops_supported: null    # 集合通信能否进图

  # 是否有"把一段子图编成单个二进制 kernel"的能力
  # 对应昇腾 SuperKernel。决定 model-infer-superkernel 能否迁移
  kernel_fusion_codegen:
    available: null               # true / false
    api: null
    scope_annotation: null        # 标记融合范围的写法
    notes: null

# ------------------------------------------------------------------------------
# 7. 算子库
#    —— fusion、kvcache、quantization、parallel-impl 依赖这里。
#    只填你真实提供的算子，没有就留 null。skills 会据此决定走融合路径还是
#    朴素 PyTorch 路径。
# ------------------------------------------------------------------------------
kernels:
  _status: unknown

  attention:
    # 变长/拼包 attention
    flash_attention_varlen: null  # 例: "flash_attn.flash_attn_varlen_func"
    # 带 KV cache 的 decode attention
    paged_attention: null         # 例: "vllm._custom_ops.paged_attention_v2"
    # PyTorch 原生 SDPA 是否可用（兜底路径）
    sdpa_available: null          # true / false
    # KV cache 的内存布局
    kv_cache_layout: null         # 例: "NHD" / "HND" / 自定义
    # 是否支持 MLA（DeepSeek 那类压缩 KV）专用算子
    mla_support: null             # true / false
    # 支持的 mask / 稀疏模式
    supported_mask_modes: []

  moe:
    grouped_gemm: null            # 例: "grouped_gemm.ops.gmm"
    topk_gating: null
    token_permute: null           # dispatch
    token_unpermute: null         # combine
    # 专家并行的 all-to-all 实现
    expert_parallel_dispatch: null

  normalization:
    rmsnorm: null
    layernorm: null
    # 是否有 residual+norm 融合
    fused_add_norm: null

  activation:
    swiglu: null
    geglu: null

  rope:
    apply_rotary: null
    interleaved_supported: null   # true / false

  quantization:
    int8_gemm: null               # 例: "torch._int_mm"
    fp8_gemm: null
    int4_gemm: null
    dynamic_quant: null
    # 支持的量化格式
    supported_formats: []         # 例: ["w8a8", "w8a16", "w4a16"]
    # 权重是否需要转换成特殊内存布局才能被量化算子接受
    weight_layout_requirement: null

  memory:
    # 软件预取：把权重提前搬进片上缓存
    # 决定 model-infer-prefetch 能否迁移
    weight_prefetch:
      available: null             # true / false
      api: null
      # 预取语义：以 tensor 依赖为栅栏？还是纯异步 memcpy？
      semantics: null
    # 统一内存 / 页迁移
    unified_memory: null          # true / false
    host_offload_api: null

# ------------------------------------------------------------------------------
# 8. 诊断与排障
#    —— runtime-debug、oom-analysis 依赖这里。
# ------------------------------------------------------------------------------
diagnostics:
  _status: unknown

  # 设备状态查询命令，CUDA 侧对应 nvidia-smi
  smi_command: null               # 例: "nvidia-smi"
  smi_query_memory: null          # 例: "nvidia-smi --query-gpu=memory.used --format=csv"

  # 错误码体系。runtime-debug 的分类表依赖它。
  # 按"症状 -> 特征串"组织，填你的 runtime 实际输出的关键字。
  error_signatures:
    device_timeout: []            # 例: ["CUDA error: the launch timed out"]
    illegal_memory_access: []     # 例: ["an illegal memory access was encountered"]
    out_of_memory: []             # 例: ["CUDA out of memory", "OutOfMemoryError"]
    collective_timeout: []        # 例: ["NCCL timeout", "Watchdog caught collective"]
    kernel_launch_failure: []
    compile_error: []

  # OOM 来源分类。oom-analysis 的 Step0 依赖它。
  # 不同 allocator 的 OOM 对应不同处置路径。
  oom_sources:
    caching_allocator: []         # 例: ["CUDA out of memory", "Tried to allocate"]
    workspace_allocator: []       # 临时工作区 OOM 的特征串，没有就留空
    collective_buffer: []         # 通信缓冲 OOM 的特征串
    host_memory: []

  # 内存分析工具
  memory_tools:
    snapshot_visualizer: null     # 例: "https://docs.pytorch.org/memory_viz"
    deep_analysis_tool: null      # 例: "mosaic"

  # 竞态/内存检查器，对应 compute-sanitizer / mssanitizer
  sanitizer:
    available: null
    command: null
    tools: []                     # 例: ["memcheck", "racecheck", "synccheck"]

# ------------------------------------------------------------------------------
# 9. 精度调试工具栈
#    —— 3 个 train-precision skill 依赖这里。这是目前迁移阻塞最大的一节。
#    如果没有现成工具，见 docs/pending-migration/ 下的精度三件套文档。
# ------------------------------------------------------------------------------
precision_tools:
  _status: unknown

  # 是否有框架级的张量 dump / 比对工具（精度诊断的执行底座）
  dump_framework:
    available: null               # true / false
    name: null
    # 支持的采集粒度
    levels: []                    # 例: ["module", "api", "kernel"]
    # 支持的采集内容
    modes: []                     # 例: ["statistics", "tensor", "md5"]
    # 比对命令
    compare_command: null
    # 溢出检测
    overflow_check_command: null

  # 没有现成工具时的兜底：是否能用 PyTorch 原生 hook 自建
  pytorch_hooks_usable: null      # true / false

  # 确定性计算支持程度
  determinism:
    deterministic_algorithms_supported: null   # true / false / "partial"
    # 已知的非确定性算子清单
    known_nondeterministic_ops: []
    # 集合通信是否确定性
    collective_deterministic: null

# ------------------------------------------------------------------------------
# 10. 训练框架
#     —— oom-analysis、log-visualization、precision 系列的示例路径依赖这里。
# ------------------------------------------------------------------------------
training_framework:
  _status: unknown
  name: null                      # 例: "torchtitan" / "Megatron-LM" / 自研
  config_style: null              # 例: "toml" / "python-registry" / "yaml" / "argparse"
  entrypoint: null
  # 训练日志格式。log-visualization 的正则依赖它
  log_format:
    style: null                   # 例: "torchtitan" / "megatron" / "custom"
    # 各指标在日志中的字面 key，没有就留 null
    metric_keys:
      step: null                  # 例: "step:"
      loss: null                  # 例: "loss:"
      grad_norm: null             # 例: "grad_norm:"
      memory: null
      throughput: null            # tokens/s
      tflops: null
      mfu: null
      step_time: null

# ------------------------------------------------------------------------------
# 11. 推理框架
#     —— migrator、kvcache、parallel-impl、quantization 的落地契约依赖这里。
# ------------------------------------------------------------------------------
inference_framework:
  _status: unknown
  # 目标推理框架。决定 migrator 的"框架部署模式"往哪接
  name: null                      # 例: "vLLM" / "SGLang" / "TensorRT-LLM" / 自研
  # 模型注册/接入的契约入口
  model_registry_path: null
  # 模型类必须实现的接口
  required_interfaces: []
  config_format: null             # 例: "yaml" / "json"
  # 是否支持独立部署（自管 Runner，不依赖框架）
  standalone_mode_supported: null

# ------------------------------------------------------------------------------
# 12. 显式登记：已知不支持 / 未确认的能力
#     填这里的内容会被 skills 读到，用于在执行前提醒"这条路走不通"。
# ------------------------------------------------------------------------------
unknown_or_unsupported:
  # 格式: - capability: <profile 中的字段路径>
  #         status: not_supported | unknown
  #         reason: <原因>
  #         affects: [<受影响的 skill 名>]
  - capability: null
    status: null
    reason: null
    affects: []
